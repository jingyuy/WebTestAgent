# Optional overlay: let `browser_wait_for_human` park a run for a person.
#
# Apply it on top of the profile you are using:
#
#     npx @deepseek-ai/dsh@0.1.5-rc.2 --profile web \
#       --patch /Users/jingyuyan/Documents/ws/WebTestAgent/dsh/web-browse-picker.patch.yml \
#       --patch /Users/jingyuyan/Documents/ws/WebTestAgent/dsh/human-in-the-loop.patch.yml \
#       --no-open --port 3099
#
# The paths are absolute on purpose. `--patch` is resolved against the shell's
# working directory, so a relative `./dsh/...` only works if you happen to be at
# the repo root — run from anywhere else (e.g. /tmp) and it will not find them.
#
# Several `--patch` flags are allowed and layer in the order given (verified
# against dsh 0.1.5-rc.2).
#
# ── why `headless: false` and not just `humanInTheLoop: true` ───────────────
#
# The human-in-the-loop path is only meaningful if a person can actually SEE
# the browser. A headless Chromium has no window, so there is nothing to solve:
# setting `humanInTheLoop: true` there does not give you a usable loop, it only
# stops the tool from refusing. Use that form solely when a human reaches the
# browser out of band (a VNC/remote viewer, or a CDP session).
#
# `humanInTheLoop` resolves as `config.humanInTheLoop ?? !headless`, so
# `headless: false` alone turns it on. This file deliberately leaves the key out
# rather than repeating what the window already says.
#
# ── why every key is restated ──────────────────────────────────────────────
#
# A patch that matches a row assigns the keys it mentions, so `config:`
# REPLACES the row's config object rather than merging into it. Listing only
# `headless` would silently reset `timeoutMs`, `recordVideo` and the rest to the
# plugin's own defaults — which happen to be identical today, so nothing would
# break, but the values would stop tracking the row.

- id: browser-playwright
  name: '@webtestagent/dsh-browser-playwright'
  config:
    # The point of this overlay: a real window a person can interact with.
    #
    # No `humanInTheLoop` key: it resolves as `config.humanInTheLoop ?? !headless`
    # and every reader goes through the resolved value, so `headless: false` is
    # enough on its own (verified by calling `resolveConfig` directly). The one
    # case that would need it spelled out is a headless browser a person reaches
    # out of band — then set `humanInTheLoop: true` next to `headless: true`.
    headless: false

    # Restated from the plugin's own row, so this overlay stays a delta.
    timeoutMs: 15000
    idleTimeoutMs: 600000
    recordVideo: true
    screenshots: true

    # Worth switching on alongside this: a persistent profile is what stops the
    # challenge appearing in the first place, by letting the site see a
    # returning person. Independent of the human loop — enable it deliberately.
    #
    # persistent: true
