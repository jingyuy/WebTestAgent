<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Test Agent</title>
    <style>
      :root {
        --bg: #0b0f17;
        --panel: #121826;
        --panel-2: #171f30;
        --border: #253147;
        --text: #e6ecf7;
        --muted: #8b9ab3;
        --accent: #4f8cff;
        --pass: #35c88a;
        --fail: #ff5f57;
        --warn: #f5b83d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap { max-width: 1360px; margin: 0 auto; padding: 24px; }
      header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
      header h1 { font-size: 19px; margin: 0; letter-spacing: 0.2px; white-space: nowrap; }
      header .sub { color: var(--muted); font-size: 12.5px; }
      .pill {
        margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 999px;
        border: 1px solid var(--border); color: var(--muted); background: var(--panel);
        white-space: nowrap;
      }
      .grid { display: grid; grid-template-columns: 400px 1fr; gap: 18px; align-items: start; }
      @media (max-width: 1080px) { .grid { grid-template-columns: 1fr; } }
      .card {
        background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
      }
      .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; }
      label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 6px; }
      input[type="text"], textarea, select, input[type="number"] {
        width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 8px; padding: 9px 11px; font: inherit; resize: vertical;
      }
      textarea { min-height: 116px; }
      input:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
      .row { display: flex; gap: 10px; }
      .row > * { flex: 1; }
      .checks { display: flex; gap: 16px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
      .checks label { display: flex; align-items: center; gap: 6px; margin: 0; }
      button {
        font: inherit; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2);
        color: var(--text); padding: 9px 14px; cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #05132b; font-weight: 650; width: 100%; margin-top: 16px; padding: 11px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .chip { font-size: 11.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); cursor: pointer; background: transparent; }
      .chip:hover { border-color: var(--accent); color: var(--text); }
      .cols { display: grid; grid-template-columns: 1fr 380px; gap: 18px; }
      @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
      .badge { display: inline-block; font-size: 11.5px; font-weight: 650; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
      .badge.running { color: var(--warn); border-color: var(--warn); }
      .badge.passed { color: var(--pass); border-color: var(--pass); }
      .badge.failed { color: var(--fail); border-color: var(--fail); }
      .badge.error { color: var(--fail); border-color: var(--fail); }
      .timeline { max-height: 520px; overflow: auto; margin: 0; padding: 0; list-style: none; }
      .timeline li { display: flex; gap: 10px; padding: 7px 4px; border-bottom: 1px dashed rgba(255,255,255,0.06); }
      .timeline .idx { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 22px; text-align: right; }
      .timeline .mark { width: 14px; }
      .timeline .mark.ok { color: var(--pass); }
      .timeline .mark.bad { color: var(--fail); }
      .timeline .body { flex: 1; min-width: 0; }
      .timeline .tool { font-weight: 600; }
      .timeline .args { color: var(--muted); }
      .timeline .meta { color: #6b7a94; font-size: 11.5px; }
      .timeline .err { color: var(--fail); }
      .assistant { color: #b9cdf3; font-style: italic; padding: 8px 4px; border-bottom: 1px dashed rgba(255,255,255,0.06); }
      .placeholder { color: var(--muted); font-size: 12.5px; }
      .shot { width: 100%; border-radius: 8px; border: 1px solid var(--border); background: #000; display: block; }
      .thumbs { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; }
      .thumbs img { height: 54px; border-radius: 5px; border: 1px solid var(--border); cursor: pointer; }
      .banner { border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; border: 1px solid var(--border); background: var(--panel); }
      .banner.passed { border-color: var(--pass); }
      .banner.failed, .banner.error { border-color: var(--fail); }
      .banner h3 { margin: 0 0 6px; font-size: 15px; }
      .banner p { margin: 0; color: var(--muted); }
      .banner ol { margin: 10px 0 0 18px; padding: 0; color: var(--text); }
      .banner ol li { margin: 3px 0; }
      video { width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; background: #000; }
      .links { margin-top: 10px; font-size: 12px; }
      .links a { color: var(--accent); text-decoration: none; margin-right: 12px; }
      .hidden { display: none; }
      .stats { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 8px; }
      .stats b { color: var(--text); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Web Test Agent</h1>
        <span class="sub">URL + plain-English instruction &rarr; real browser run &rarr; trustworthy PASS/FAIL</span>
        <span class="pill" id="health">checking model…</span>
      </header>

      <div class="grid">
        <section class="card">
          <h2>New run</h2>
          <form id="form">
            <label for="url">URL</label>
            <input type="text" id="url" value="/demo/" placeholder="https://example.com" required />

            <label for="instruction">Test instruction</label>
            <textarea id="instruction" required>Log in as test@example.com / password123, create a project called "AI Test", and verify it appears in the list.</textarea>

            <div class="chips" id="scenarios"></div>

            <div class="checks">
              <label><input type="checkbox" id="headed" /> Show browser</label>
              <label><input type="checkbox" id="video" checked /> Record video</label>
            </div>

            <label for="steps">Max steps</label>
            <input type="number" id="steps" value="40" min="1" max="200" />

            <button type="submit" class="primary" id="run">Run test</button>
          </form>
        </section>

        <section>
          <div id="banner" class="banner hidden"></div>

          <div class="card">
            <h2>
              Run log
              <span class="badge" id="status">idle</span>
            </h2>
            <div class="cols">
              <ul class="timeline" id="timeline">
                <li class="placeholder">No run yet. Pick a scenario or write your own instruction.</li>
              </ul>

              <div>
                <img id="shot" class="shot hidden" alt="Latest screenshot" />
                <div class="thumbs" id="thumbs"></div>
                <video id="videoPlayer" class="hidden" controls></video>
                <div class="links" id="links"></div>
                <div class="stats" id="stats"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const timeline = $("timeline");
      const banner = $("banner");
      const statusBadge = $("status");
      const shot = $("shot");
      const thumbs = $("thumbs");
      const videoPlayer = $("videoPlayer");
      const links = $("links");
      const stats = $("stats");
      const runButton = $("run");

      let source = null;

      fetch("/api/health")
        .then((r) => r.json())
        .then((h) => {
          $("health").textContent = h.llmConfigured
            ? `model ${h.model}`
            : "DEEPSEEK_API_KEY missing";
        })
        .catch(() => ($("health").textContent = "server offline"));

      fetch("/api/scenarios")
        .then((r) => r.json())
        .then(({ scenarios, demoUrl }) => {
          const box = $("scenarios");
          scenarios.forEach((scenario) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "chip";
            button.textContent = scenario.name;
            button.onclick = () => {
              $("url").value = scenario.url;
              $("instruction").value = scenario.instruction;
            };
            box.appendChild(button);
          });
          if (!$("url").value) $("url").value = demoUrl;
        })
        .catch(() => {});

      $("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        await startRun();
      });

      function setStatus(status) {
        statusBadge.textContent = status;
        statusBadge.className = `badge ${status}`;
      }

      function reset() {
        timeline.innerHTML = "";
        thumbs.innerHTML = "";
        links.innerHTML = "";
        stats.innerHTML = "";
        banner.className = "banner hidden";
        banner.innerHTML = "";
        shot.classList.add("hidden");
        videoPlayer.classList.add("hidden");
        runButton.disabled = true;
        setStatus("running");
      }

      function showError(message) {
        banner.className = "banner error";
        banner.innerHTML = `<h3>Could not start run</h3><p>${escapeHtml(message)}</p>`;
        setStatus("error");
        runButton.disabled = false;
      }

      async function startRun() {
        reset();
        const payload = {
          url: $("url").value,
          instruction: $("instruction").value,
          headless: !$("headed").checked,
          recordVideo: $("video").checked,
          maxSteps: Number($("steps").value) || 40,
        };

        let response;
        try {
          response = await fetch("/api/runs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
        } catch (error) {
          showError(error.message);
          return;
        }

        if (!response.ok) {
          const body = await response.json().catch(() => ({ error: response.statusText }));
          showError(body.error || "Request failed");
          return;
        }

        const { id } = await response.json();
        subscribe(id);
      }

      function subscribe(runId) {
        if (source) source.close();
        source = new EventSource(`/api/runs/${runId}/events`);
        source.addEventListener("end", () => source.close());
        source.onmessage = (event) => {
          try {
            handleEvent(JSON.parse(event.data));
          } catch (error) {
            console.error(error);
          }
        };
        source.onerror = () => {
          /* the server closes the stream when the run finishes */
        };
      }

      function handleEvent(event) {
        switch (event.type) {
          case "status":
            setStatus(event.status);
            break;
          case "action":
            addAction(event.action);
            break;
          case "assistant":
            addAssistant(event.text);
            break;
          case "artifacts":
            renderArtifacts(event.artifacts);
            break;
          case "result":
            renderResult(event.result);
            break;
          case "error":
            banner.className = "banner error";
            banner.innerHTML = `<h3>Run error</h3><p>${escapeHtml(event.message)}</p>`;
            break;
          case "done":
            finish(event.run);
            break;
        }
      }

      function addAction(action) {
        const placeholder = timeline.querySelector(".placeholder");
        if (placeholder) placeholder.remove();

        const li = document.createElement("li");
        const ok = action.result === "success";
        const args = [action.target, action.value].filter((v) => v !== undefined && v !== null && v !== "");
        li.innerHTML = `
          <span class="idx">${action.index}</span>
          <span class="mark ${ok ? "ok" : "bad"}">${ok ? "\u2713" : "\u2717"}</span>
          <span class="body">
            <span class="tool">${escapeHtml(action.tool.replace(/^browser_/, ""))}</span>
            <span class="args">${escapeHtml(args.join(" = "))}</span>
            <div class="meta">${action.durationMs}ms${
              action.error ? ` · <span class="err">${escapeHtml(action.error)}</span>` : ""
            }</div>
          </span>`;
        timeline.appendChild(li);
        timeline.scrollTop = timeline.scrollHeight;
      }

      function addAssistant(text) {
        const placeholder = timeline.querySelector(".placeholder");
        if (placeholder) placeholder.remove();
        const div = document.createElement("div");
        div.className = "assistant";
        div.textContent = text.length > 400 ? `${text.slice(0, 400)}…` : text;
        timeline.appendChild(div);
        timeline.scrollTop = timeline.scrollHeight;
      }

      function renderArtifacts(artifacts) {
        const shots = artifacts.filter((a) => a.kind === "screenshot");
        if (shots.length) {
          const latest = shots[shots.length - 1];
          shot.src = `/artifacts/${latest.path}`;
          shot.classList.remove("hidden");
          thumbs.innerHTML = "";
          shots.forEach((artifact) => {
            const img = document.createElement("img");
            img.src = `/artifacts/${artifact.path}`;
            img.title = artifact.label || artifact.path;
            img.onclick = () => (shot.src = `/artifacts/${artifact.path}`);
            thumbs.appendChild(img);
          });
        }

        const video = artifacts.find((a) => a.kind === "video");
        if (video) {
          videoPlayer.src = `/artifacts/${video.path}`;
          videoPlayer.classList.remove("hidden");
        }
      }

      function renderResult(result) {
        banner.className = `banner ${result.status}`;
        const steps = (result.steps || []).map((s) => `<li>${escapeHtml(s)}</li>`).join("");
        banner.innerHTML = `
          <h3>${result.status === "passed" ? "PASS" : "FAIL"}</h3>
          <p>${escapeHtml(result.summary)}</p>
          ${steps ? `<ol>${steps}</ol>` : ""}`;
      }

      function finish(run) {
        setStatus(run.status);
        if (run.result) renderResult(run.result);
        else if (run.error) {
          banner.className = "banner error";
          banner.innerHTML = `<h3>Run error</h3><p>${escapeHtml(run.error)}</p>`;
        }
        renderArtifacts(run.artifacts || []);

        links.innerHTML = "";
        (run.artifacts || [])
          .filter((a) => a.kind === "result" || a.kind === "transcript")
          .forEach((artifact) => {
            const a = document.createElement("a");
            a.href = `/artifacts/${artifact.path}`;
            a.target = "_blank";
            a.textContent = artifact.label || artifact.path;
            links.appendChild(a);
          });

        const failures = (run.actions || []).filter((a) => a.result === "failure").length;
        stats.innerHTML = `
          <span><b>${(run.actions || []).length}</b> actions</span>
          <span><b>${failures}</b> failed</span>
          <span><b>${((run.durationMs || 0) / 1000).toFixed(1)}s</b></span>
          <span><b>${(run.usage && run.usage.totalTokens) || 0}</b> tokens</span>`;

        runButton.disabled = false;
        if (source) source.close();
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c]);
      }
    </script>
  </body>
</html>
